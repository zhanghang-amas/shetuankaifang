<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="blue">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="零依赖的 DeepSeek 网页对话界面：流式输出、深度思考、多套主题，API Key 只保存在你自己的浏览器里。" />
  <meta property="og:title" content="DeepSeek 网页助手" />
  <meta property="og:description" content="支持流式输出与深度思考的 DeepSeek 网页界面，API Key 只保存在你自己的浏览器里。" />
  <meta property="og:type" content="website" />
  <title>DeepSeek 网页助手</title>
  <link rel="icon" href="favicon.svg" />
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('ds-theme') || 'system';
        var accents = ['blue', 'violet', 'teal', 'green', 'amber', 'rose'];
        var a = localStorage.getItem('ds-accent') || 'blue';
        if (accents.indexOf(a) < 0) a = 'blue';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.accent = a;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=13" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <ellipse cx="14" cy="18.5" rx="10.5" ry="7.5" fill="currentColor" />
              <path d="M23.5 18.5 30 12.8v11.4Z" fill="currentColor" />
              <path d="M13 10.6c0-2.2 1.2-4 3.2-4.8M17 10.2c0-1.5.7-2.8 1.9-3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <circle cx="9.8" cy="16.7" r="1.15" fill="#fff" />
            </svg>
          </span>
          <span class="brand-name">DeepSeek</span>
        </div>
        <button class="icon-btn only-mobile" id="closeSidebar" aria-label="收起侧栏">✕</button>
      </div>

      <button class="new-chat" id="newChat">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        新对话
      </button>

      <div class="history-label">最近</div>
      <nav class="history" id="history" aria-label="历史对话"></nav>

      <div class="sidebar-foot">
        <button class="ghost-btn" id="settingsBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
          设置
        </button>
        <p class="privacy-note">Key 与对话只存在你的浏览器</p>
      </div>
    </aside>

    <div class="backdrop" id="backdrop" hidden></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSidebar" aria-label="打开侧栏">☰</button>

        <label class="model-picker" title="切换模型">
          <select id="modelSelect" aria-label="选择模型">
            <option value="deepseek-chat">DeepSeek Chat</option>
            <option value="deepseek-reasoner">DeepSeek Reasoner</option>
          </select>
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </label>

        <div class="topbar-right">
          <span class="conn-state" id="connState" title="服务状态">本机运行</span>

          <div class="theme-wrap">
            <button class="icon-btn" id="themeBtn" aria-label="外观" title="外观与主题色">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
                <path d="M12 3.8v16.4a8.2 8.2 0 0 0 0-16.4Z" fill="currentColor"/>
              </svg>
            </button>

            <div class="theme-pop" id="themePop" hidden>
              <div class="pop-label">外观</div>
              <div class="seg" id="themeSeg">
                <button type="button" data-mode="light">浅色</button>
                <button type="button" data-mode="dark">深色</button>
                <button type="button" data-mode="system">跟随系统</button>
              </div>

              <div class="pop-label">主题色</div>
              <div class="swatches" id="swatches">
                <button type="button" class="swatch" data-accent="blue" style="--sw: #4d6bfe" aria-label="蓝色"></button>
                <button type="button" class="swatch" data-accent="violet" style="--sw: #7c5cff" aria-label="紫色"></button>
                <button type="button" class="swatch" data-accent="teal" style="--sw: #0f9d94" aria-label="青色"></button>
                <button type="button" class="swatch" data-accent="green" style="--sw: #2e9e5b" aria-label="绿色"></button>
                <button type="button" class="swatch" data-accent="amber" style="--sw: #d97a1f" aria-label="橙色"></button>
                <button type="button" class="swatch" data-accent="rose" style="--sw: #d4517f" aria-label="粉色"></button>
              </div>
            </div>
          </div>

          <button class="icon-btn" id="topSettingsBtn" aria-label="设置">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <div class="welcome-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <ellipse cx="14" cy="18.5" rx="10.5" ry="7.5" fill="currentColor" />
              <path d="M23.5 18.5 30 12.8v11.4Z" fill="currentColor" />
              <path d="M13 10.6c0-2.2 1.2-4 3.2-4.8M17 10.2c0-1.5.7-2.8 1.9-3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <circle cx="9.8" cy="16.7" r="1.15" fill="#fff" />
            </svg>
          </div>
          <h1>今天想聊点什么？</h1>
          <p class="welcome-sub">请求由你的浏览器直接发往 DeepSeek，不经过任何第三方服务器。</p>
          <div class="chips" id="chips">
            <button class="chip" data-prompt="用三句话解释什么是大语言模型的上下文窗口">解释上下文窗口</button>
            <button class="chip" data-prompt="帮我写一封请假邮件，理由是明天需要去医院复查，语气礼貌简洁">写一封请假邮件</button>
            <button class="chip" data-prompt="用 Python 写一个读取 CSV 并按某列分组求和的函数，附带示例">写段 Python 代码</button>
            <button class="chip" data-prompt="把这段话润色得更专业：我们这个项目进度有点慢，主要是人手不够">润色一段文字</button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-wrap">
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息…" autocomplete="off"></textarea>
          <div class="composer-actions">
            <button class="send-btn" id="sendBtn" aria-label="发送" title="发送 (Enter)">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="send-btn stop hidden" id="stopBtn" aria-label="停止生成" title="停止生成">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
        <p class="footnote">AI 生成的内容可能不准确 · Enter 发送，Shift + Enter 换行</p>
      </footer>
    </main>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle">设置</h2>
        <button class="icon-btn" id="closeSettings" aria-label="关闭">✕</button>
      </div>

      <div class="field">
        <label for="apiKey">DeepSeek API Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
        <p class="field-hint" id="keyHint">在 platform.deepseek.com 创建，只保存在你自己这台设备上。</p>
      </div>

      <div class="field">
        <label for="baseUrl">API 地址</label>
        <input id="baseUrl" type="text" placeholder="https://api.deepseek.com" spellcheck="false" />
        <p class="field-hint">一般不用改。用代理或中转时填对应地址（不要带 /v1）。</p>
      </div>

      <div class="field">
        <label for="systemPrompt">系统提示词</label>
        <textarea id="systemPrompt" rows="3" placeholder="你是一个乐于助人的 AI 助手…"></textarea>
      </div>

      <p class="test-result" id="testResult" hidden></p>

      <div class="modal-foot">
        <button class="text-btn danger" id="clearKeyBtn" type="button">清除 Key</button>
        <button class="text-btn" id="testBtn" type="button">测试连接</button>
        <div class="spacer"></div>
        <button class="text-btn" id="cancelSettings" type="button">取消</button>
        <button class="primary-btn" id="saveSettings" type="button">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="static-adapter.js?v=1"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
